# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
# The organization and project key are the defaults SonarQube Cloud gives a GitHub repository
# it imports; change them here if yours differ.
sonar.organization=iamcaominhtien
sonar.projectKey=iamcaominhtien_rust-pdf-parser
sonar.projectName=kakemono

sonar.sources=src,python/kakemono,scripts
sonar.tests=tests,python/tests
sonar.sourceEncoding=UTF-8
# Embedded binary assets (fonts, sound) and test data are not code.
sonar.exclusions=src/render/friendly/fonts/**,src/render/friendly/sounds/**
sonar.test.exclusions=tests/data/**
sonar.test.inclusions=tests/**,python/tests/**
# Test code is not measured for coverage, whatever SonarQube classifies it as. Nor are the
# evaluation scripts (eval/): they need datasets and models that CI does not have.
sonar.coverage.exclusions=tests/**,python/tests/**,eval/**

# Reports made by the workflow before the scan: clippy findings as external issues, and test
# coverage from cargo-llvm-cov (Rust) and pytest-cov (Python).
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
# Coverage of the Python package, from pytest-cov.
sonar.python.coverage.reportPaths=coverage-python.xml
sonar.python.version=3.9
