[package]
name = "kakemono"
version = "0.16.0"
edition = "2024"
description = "Convert scientific-paper PDFs (arXiv) and Word documents into clean, readable HTML in four fidelity modes, Word documents, Markdown, LaTeX or EPUB books"
repository = "https://github.com/iamcaominhtien/kakemono"
documentation = "https://docs.rs/kakemono"
readme = "README.md"
# What goes into the package published on crates.io; the tests, scripts, docs and
# Python binding stay in the repository only.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]
keywords = ["pdf", "docx", "html", "arxiv", "converter"]
categories = ["command-line-utilities", "text-processing"]
license = "MIT"

[lib]
name = "kakemono"
path = "src/lib.rs"

[[bin]]
name = "kakemono"
path = "src/main.rs"

[dependencies]
hayro = "0.9"
hayro-interpret = "0.9"
hayro-syntax = "0.9"
hayro-svg = "0.9"
hayro-font = "0.5"
kurbo = "0.13"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
regex = "1"
unicode-normalization = "0.1"
skrifa = "0.49"
ureq = { version = "2", features = ["native-certs"] }
resvg = { version = "0.45", default-features = false, features = ["raster-images", "text", "system-fonts", "memmap-fonts"] }
# The CLI's allocator (src/main.rs). Version 2 of mimalloc: version 3 keeps
# freed memory for a second, so a 15-page paper took three times the memory
# of the system allocator.
mimalloc = { version = "0.1.52", features = ["v2"] }
libmimalloc-sys = { version = "0.1.49", features = ["extended", "v2"] }
png = "0.18"
sha2 = "0.10"
roxmltree = "0.20"
cfb = "0.16"
# The Word layout engine: text shaping, and the PDF it writes.
rustybuzz = "0.20"
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
# Real tokenizers for `--tokenizer` of the chunks output (optional: without
# them, chunk sizes are estimated). Hugging Face's reads the tokenizer.json of
# an embedding model; tiktoken-rs holds OpenAI's cl100k_base and o200k_base
# (about 6 MB; bpe-openai, faster, adds 70 MB of tables).
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
tiktoken-rs = { version = "0.12", optional = true }

[features]
default = ["tokenizers", "openai-tokenizers"]
## `--tokenizer path/to/tokenizer.json` (Hugging Face tokenizers).
tokenizers = ["dep:tokenizers"]
## `--tokenizer cl100k_base` / `o200k_base` (OpenAI's tokenizers).
openai-tokenizers = ["dep:tiktoken-rs"]

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
