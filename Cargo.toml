[package]
name = "kakemono"
version = "0.8.0"
edition = "2024"
description = "Convert scientific-paper PDFs (arXiv) into clean, readable HTML in four fidelity modes, Word documents, Markdown, LaTeX or EPUB books"
repository = "https://github.com/iamcaominhtien/kakemono"
documentation = "https://docs.rs/kakemono"
readme = "README.md"
# What goes into the package published on crates.io; the tests, scripts, docs and
# Python binding stay in the repository only.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]
keywords = ["pdf", "html", "arxiv", "converter", "papers"]
categories = ["command-line-utilities", "text-processing"]
license = "MIT"

[lib]
name = "kakemono"
path = "src/lib.rs"

[[bin]]
name = "kakemono"
path = "src/main.rs"

[dependencies]
hayro = "0.9"
hayro-interpret = "0.9"
hayro-syntax = "0.9"
hayro-svg = "0.9"
hayro-font = "0.5"
kurbo = "0.13"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
unicode-normalization = "0.1"
skrifa = "0.49"
ureq = { version = "2", features = ["native-certs"] }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
sha2 = "0.10"
