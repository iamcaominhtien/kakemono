# Reading a PDF recurses deeply: the native worker threads have 16 MB of
# stack, and so does the module's shadow stack (the default is 1 MB).
# SIMD (simd128): 1.8 times faster on the test papers (drawing pictures
# above all); every browser has it since 2023 (Safari 16.4, Chrome 91,
# Firefox 89), and so do Node 16.4+, Deno and Cloudflare Workers.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216", "-C", "target-feature=+simd128"]

[build]
target = "wasm32-unknown-unknown"
