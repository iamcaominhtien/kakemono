name: Python

# The Python package (python/): built and tested on every pull request, and
# published to PyPI after each release.
#  - `plan` decides what to build. After the Release workflow (or when started by
#    hand), it builds the newest release tag if PyPI does not have that version yet,
#    and publishes it; otherwise it only builds and tests.
#  - `test` runs the Python tests; `wheels` and `sdist` build the packages.
#  - `publish` uploads them to PyPI with a trusted publisher (no token): PyPI trusts
#    this workflow file (`python.yml`) running in the `pypi` environment.
# Tags pushed by the Release workflow do not start other workflows, hence the
# `workflow_run` trigger.
on:
  pull_request:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: python-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Plan
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && 'main' || '' }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          ref=$(git rev-parse HEAD)
          publish=false
          if [ "$EVENT" = workflow_run ] || [ "$EVENT" = workflow_dispatch ]; then
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              ref="$tag"
              if curl -sf -o /dev/null "https://pypi.org/pypi/kakemono/$version/json"; then
                echo "kakemono $version is already on PyPI"
              else
                publish=true
              fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "build $ref as version $version, publish: $publish"

  test:
    name: Python tests
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: fmt + clippy
        working-directory: python
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Build and test
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.9,<2" pytest
          maturin develop --release
          pytest -v tests

  wheels:
    name: Wheel ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, native: true, manylinux: auto }
          # The manylinux2014 cross compiler is too old for ring's ARM assembly.
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, native: false, manylinux: "2_28" }
          - { name: macos-x86_64, os: macos-15, target: x86_64, native: false, manylinux: auto }
          - { name: macos-arm64, os: macos-15, target: aarch64, native: true, manylinux: auto }
          - { name: windows-x64, os: windows-latest, target: x64, native: true, manylinux: auto }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set the package version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python scripts/set-python-version.py "$VERSION"
      - uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist -m python/Cargo.toml
          manylinux: ${{ matrix.manylinux }}
      - name: Import the wheel
        if: matrix.native
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist kakemono
          python -c "import kakemono; print('kakemono', kakemono.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source package
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set the package version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python scripts/set-python-version.py "$VERSION"
      - uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [plan, test, wheels, sdist]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/kakemono/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
