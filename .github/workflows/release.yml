name: Release

# The merged commit of a pull request is the release: every PR carries its new
# version (Cargo.toml, Cargo.lock) and its CHANGELOG.md entry, written by
# `scripts/release.py bump --pr N` and checked by the PR workflow (see
# CONTRIBUTING.md). On every push to main:
#  - `release` tags the pushed commit `vX.Y.Z` when that version has no tag yet,
#    and creates the GitHub release with its CHANGELOG.md entry as notes;
#    nothing is committed to main;
#  - `binaries` then attaches prebuilt binaries to the release;
#  - `crate` publishes the new version on crates.io (secret CARGO_REGISTRY_TOKEN).
# The Python package is published by the Python workflow once this one is done.
on:
  push:
    branches: [main]

permissions: {}

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Tag and release
    if: github.repository_owner == 'iamcaominhtien'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Tag the pushed commit and create the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/release.py version)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is released already: nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/release.py notes "$version" > "$RUNNER_TEMP/notes.md"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.created == 'true' && needs.release.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - name: Static C runtime on Windows
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: kakemono
          target: ${{ matrix.target }}
          locked: true
          include: README.md,LICENSE
          tar: unix
          zip: windows
          checksum: sha256
          ref: refs/tags/${{ needs.release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  crate:
    name: Publish on crates.io
    needs: release
    if: needs.release.outputs.created == 'true' && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
