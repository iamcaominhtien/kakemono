name: PR

# A pull request is squash-merged and its merged commit is the release, so:
#  - its title is a Conventional Commits subject (it becomes the commit and sets
#    the version);
#  - it carries the version its title asks for, with its CHANGELOG.md entry
#    (`scripts/release.py bump --pr N` writes both; see CONTRIBUTING.md).
# When the version or the entry is not the one the title and description ask
# for, this workflow writes them and pushes a `chore(release)` commit onto the
# PR's branch, with the RELEASE_TOKEN secret (a token that may push to the
# repository: a push made with the workflow's own token would not start the
# other workflows). Without the secret, or on a fork, it fails as before and
# the bump is run by hand.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Title and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          kinds='feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert'
          if printf '%s' "$TITLE" | grep -qE "^($kinds)(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$"; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "::error::The PR title must be a Conventional Commits subject, for example"
          echo "::error::'feat(tables): ...', 'fix: ...', 'feat!: ...' (breaking; the ! goes before the colon)."
          echo "::error::Kinds: $kinds. No period at the end. Got: $TITLE"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # every branch and tag: main and the last release tag are compared
          fetch-depth: 0
          persist-credentials: false
      - name: Tests of the release script
        run: pipx run pytest -q scripts/tests
      - name: Write the version and CHANGELOG.md
        id: bump
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python3 scripts/release.py bump --pr "$NUMBER" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          # The date in the heading of the entry changes from one day to the next:
          # alone, it is no reason for a commit.
          if git diff --quiet -I '^## \[' -- Cargo.toml Cargo.lock CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git checkout -- Cargo.toml Cargo.lock CHANGELOG.md
      - name: Push the release commit
        id: push
        if: steps.bump.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::No RELEASE_TOKEN secret: the version is not written for you."
            exit 0
          fi
          python3 scripts/release.py bump --pr "$NUMBER" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          version=$(python3 scripts/release.py version)
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(release): v$version" -- Cargo.toml Cargo.lock CHANGELOG.md
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "v$version written and pushed: the workflow runs again on the new commit."
      - name: Check the version and CHANGELOG.md
        if: steps.push.outputs.pushed != 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/release.py check --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
