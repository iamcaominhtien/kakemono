# The Python binding of kakemono, built with maturin (see pyproject.toml).
#
# A separate package, not a workspace member, so that building and testing the
# Rust crate never needs Python. Its version is set from the release tag when the
# wheels are built for a release.
[package]
name = "kakemono-python"
version = "0.3.0"
edition = "2024"
description = "Python binding of kakemono"
repository = "https://github.com/iamcaominhtien/kakemono"
license = "MIT"
publish = false

[lib]
name = "_kakemono"
crate-type = ["cdylib"]

[dependencies]
kakemono = { path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
