<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#1e2f7a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b1440" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- back page: the fixed PDF layout -->
  <g transform="rotate(-8 82 100)" filter="url(#sh)">
    <rect x="46" y="48" width="72" height="96" rx="8" fill="#91a7ff"/>
    <rect x="56" y="62" width="23" height="4" rx="2" fill="#5c7cfa"/>
    <rect x="85" y="62" width="23" height="4" rx="2" fill="#5c7cfa"/>
    <rect x="56" y="72" width="23" height="4" rx="2" fill="#5c7cfa"/>
    <rect x="85" y="72" width="23" height="4" rx="2" fill="#5c7cfa"/>
    <rect x="56" y="82" width="23" height="4" rx="2" fill="#5c7cfa"/>
    <rect x="85" y="82" width="23" height="4" rx="2" fill="#5c7cfa"/>
  </g>
  <!-- front page: the reflowed document -->
  <g filter="url(#sh)">
    <rect x="80" y="58" width="76" height="98" rx="8" fill="#f8f9ff"/>
    <rect x="91" y="71" width="40" height="6" rx="3" fill="#3b5bdb"/>
    <rect x="91" y="86" width="54" height="4" rx="2" fill="#adb5d6"/>
    <rect x="91" y="95" width="54" height="4" rx="2" fill="#adb5d6"/>
    <rect x="91" y="104" width="38" height="4" rx="2" fill="#adb5d6"/>
    <rect x="91" y="117" width="54" height="4" rx="2" fill="#adb5d6"/>
    <rect x="91" y="126" width="54" height="4" rx="2" fill="#adb5d6"/>
    <rect x="91" y="135" width="30" height="4" rx="2" fill="#adb5d6"/>
  </g>
  <!-- arrow -->
  <circle cx="80" cy="140" r="15" fill="#ffd43b" filter="url(#sh)"/>
  <path d="M73 140h12m-5-5 5 5-5 5" stroke="#1e2f7a" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
