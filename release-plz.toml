# Release automation (https://release-plz.dev), run by .github/workflows/release.yml.
#
# Flow: every push to `main` (each merged PR) is released. The workflow runs
# `release-plz update`, which bumps the version in Cargo.toml and adds the new section to
# CHANGELOG.md, commits that to `main` as `chore: release vX.Y.Z`, then runs
# `release-plz release`, which creates the `vX.Y.Z` tag and the GitHub release. The
# workflow then attaches prebuilt binaries. There is no release PR.

[workspace]
# Versions come from the git tags (`vX.Y.Z`). release-plz does not publish the crate:
# the `crate` job of the Release workflow runs `cargo publish` for the new tag.
git_only = true
publish = false
# Release on every push to main: `release` releases the version in Cargo.toml as soon
# as it has no tag yet (there is no release PR to wait for).
release_always = true
changelog_update = true
git_release_enable = true
# The public API is not checked against a registry (nothing is published there).
semver_check = false
# In 0.x, `feat:` bumps the minor version (0.1.0 -> 0.2.0), `fix:` the patch version.
features_always_increment_minor = true

[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""

# One section per release. Each entry is the first line of its commit; a merged PR
# (squash commit, `... (#N)`) also shows its description, which GitHub copies into the
# commit body, so the GitHub release and CHANGELOG.md say what the PR changed. The
# preprocessors below clean that description first.
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- if commit.body and commit.message is containing("/pull/") %}

  {{ commit.body | trim | replace(from="\n", to="\n  ") }}
{% endif %}
{%- endfor %}
{% endfor %}
"""

# Applied in order to every commit message before it is parsed (Rust regex syntax).
commit_preprocessors = [
    # The PR number of a squash commit as a link (release-plz's default, kept here
    # because this list replaces it).
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/iamcaominhtien/kakemono/pull/${1}))" },
    # Drop what a PR description carries for its reviewers only: the "Generated by"
    # footer, the session link, trailers, and the Summary / Testing headings and sections.
    { pattern = '(?s)\n+---\n+_Generated by.*', replace = "" },
    { pattern = '(?m)^🤖 Generated with.*\n?', replace = "" },
    { pattern = '(?m)^https://claude\.ai/code/session_\S*\n?', replace = "" },
    { pattern = '(?m)^(Co-authored-by|Co-Authored-By|Claude-Session|Signed-off-by): .*\n?', replace = "" },
    { pattern = '(?m)^#{1,3} Summary\n+', replace = "" },
    # (twice: a match ends on the next heading, which the same pass cannot start from)
    { pattern = '(?s)\n#{1,3} (Testing|Tests|Test plan|Verification|Snapshots)\n.*?(\n#{1,3} |\z)', replace = "${2}" },
    { pattern = '(?s)\n#{1,3} (Testing|Tests|Test plan|Verification|Snapshots)\n.*?(\n#{1,3} |\z)', replace = "${2}" },
    # The `---------` rule GitHub puts before the trailers of a squash commit.
    { pattern = '\n+-{3,}\s*\z', replace = "\n" },
    # Headings of the description go below the "### Added" level of the changelog.
    { pattern = '(?m)^(#{1,3}) ', replace = "##${1} " },
    # GitHub wraps the squash commit body at 72 columns, and a GitHub release shows
    # every line break: join the wrapped lines of a paragraph or list item again. Lines
    # that start a list item, a heading, a table row, a quote, a code fence or an
    # indented code block are kept; the lines inside a code fence are joined, so a PR
    # description shows code indented by four spaces.
    { pattern = '([^\n])\n[ \t]{0,3}([^\n\s*+#|>`\d-]|`[^`]|\d+[^.)\d\n]|\d+[.)][^ \t\n])', replace = "${1} ${2}" },
    # A table row that does not end with `|` was wrapped too (twice for rows over three lines).
    { pattern = '(?m)^(\|[^\n]*[^|\s])[ \t]*\n', replace = "${1} " },
    { pattern = '(?m)^(\|[^\n]*[^|\s])[ \t]*\n', replace = "${1} " },
]

sort_commits = "oldest"
protect_breaking_commits = true

# Groups, in the order they appear. Conventional Commits (`feat: ...`) are the
# convention from now on (see CONTRIBUTING.md); the imperative subjects of the
# older history ("Add ...", "Fix ...") are grouped the same way.
commit_parsers = [
    { message = "^chore: release", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^(Add|Support|Rebuild|Enable) ", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^(Fix|Avoid|Correct) ", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^(Process|Load|Speed) ", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^(Split|Clean up|Move|Refine|Rename|Format) ", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(Document|Note) ", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^(ci|build)", group = "<!-- 6 -->Build and CI" },
    { message = "^chore", group = "<!-- 7 -->Other" },
    { message = ".*", group = "<!-- 7 -->Other" },
]
